    <script>self.__next_f.push([1, "Investing in the real estate sector is largely risk-free and relatively more modest than investing in other sectors. And investment in tourism real estate is smart and wise investment, more profitable and respectable investment. It is also a timely investment. Investment risk, lack of experience in the business of interest, lack of time, lack of reliable staff in the management of the business, due to several practical reasons, many people are losing the motivation to increase their earning capacity through risk-free investment, despite the financial ability and strong will. Bhaiya Hotels \u0026amp; Resorts Ltd. sincerely applauds your willingness and courage to invest. As an entrepreneurial partner, Bhaiya Hotels \u0026amp; Resorts Ltd. welcomes you to the 5-star standard Eden Bay Hotel, which is being developed in the world-famous tourist city of Cox’s Bazar. Bhaiya Hotels \u0026amp; Resorts Ltd’s Eden Bay project has brought many smart investors like you a golden opportunity to invest their hard-earned money with the promise of lifetime halal and guaranteed returns through risk-free investment. The Eden Bay 5 star standard tourist accommodation is being developed in a unique architectural style on 27.07 katha or 44.67 decimal of land in an aesthetic and breathtaking location created by the combination of sea and mountains.\u003cbr\u003e\u003cbr\u003e\r\nMeanwhile, the construction work of Eden Bay has progressed a lot. Bhaiya Hotels \u0026amp; Resorts Ltd. strongly believes that Eden Bay will be able to offer world class hospitality to its esteemed guests in the coming ____. All the activities of Bhaiya Hotels \u0026amp; Resorts Ltd. based in Eden Bay are being conducted with the aim that you can get the return or profit of your invested hard-earned money within the expected time. The halal profit of your invested hard-earned money will be credited to your bank account regularly within the stipulated time. And as a proud entrepreneur and partner of Eden Bay for life, you will have the opportunity to spend a luxurious family vacation in Cox’s Bazar by staying at Eden Bay at an attractive discount. Year by year the value of your purchased Eden Bay hot shares can increase manifold. So even if you want to sell or transfer your purchased hotel shares in the future, you can do so at an increased price of several times of the purchase price. It takes about 35-40 years to get a return on the purchase price of a flat. Which is not possible to get in the lifetime of many. It will take 7-10 years to get a return equal to the purchase price of a hotel share. The decision to build a bright future for your family through profitable investments is now in your hands. Still wondering where to invest? Flat or 5 star hotel? Our advice is to invest in a 5 star hotel. And it must be at Bhaiya Hotels \u0026amp; Resorts Ltd.’s Eden Bay.\r\n"])</script>
